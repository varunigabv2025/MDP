


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piezoelectric Energy Harvesting Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                    <h1>Energy Harvesting System</h1>
                </div>

                <div class="header-stats">
                    <div class="stat-item">
                        <span class="stat-label">System Status</span>
                        <span class="stat-value status-active" id="systemStatus">Simulation</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="dashboard">
            <section class="energy-overview">
                <div class="overview-cards">

                    <div class="energy-card">
                        <div class="card-icon">
                            ⚡
                        </div>
                        <div class="card-content">
                            <h3>Total Energy Generated</h3>
                            <div class="energy-value">
                                <span id="totalEnergy">36.50</span>
                                <span class="unit">Joules</span>
                            </div>
                        </div>
                    </div>

                    <div class="energy-card">
                        <div class="card-icon">
                            ⏱️
                        </div>
                        <div class="card-content">
                            <h3>Current Power</h3>
                            <div class="energy-value">
                                <span id="currentPower">0.000</span>
                                <span class="unit">Watts</span>
                            </div>
                        </div>
                    </div>

                    <div class="energy-card">
                        <div class="card-icon">
                            👣
                        </div>
                        <div class="card-content">
                            <h3>Total Steps Detected</h3>
                            <div class="energy-value">
                                <span id="totalSteps">488</span>
                                <span class="unit">steps</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="charts-section">
                <div class="chart-container">
                    <div class="chart-header">
                        <h3>Energy Generation Over Time</h3>
                    </div>
                    <canvas id="energyChart"></canvas>
                </div>

                <div class="chart-container">
                    <div class="chart-header">
                        <h3>Power Output</h3>
                    </div>
                    <canvas id="powerChart"></canvas>
                </div>
            </section>

            <section class="system-info">
                <div class="info-card">
                    <h4>System Information</h4>

                    <div class="info-item">
                        <span>Sensor Status</span>
                        <span class="status-good">Connected</span>
                    </div>

                    <div class="info-item">
                        <span>Storage Level</span>
                        <span>67%</span>
                    </div>

                    <div class="info-item">
                        <span>Efficiency</span>
                        <span>91%</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
